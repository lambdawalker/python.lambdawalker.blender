[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[project]
name = "lambdawalker-blender"
version = "0.1.0"
description = "Blender utilities and automation for LambdaWalker"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "LambdaWalker", email = "lambdawalker@isdavid.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "lambdawalker-conda>=0.1.0",
    "numpy>=2.0.0",
    "Pillow>=10.0.0"
]

[project.urls]
Homepage = "https://github.com/lambdawalker/python.lambdawalker.blender"
Repository = "https://github.com/lambdawalker/python.lambdawalker.blender"
Issues = "https://github.com/lambdawalker/python.lambdawalker.blender/issues"

[tool.uv.build-backend]
module-name = "lambdawalker.blender"
namespace = true

[tool.uv.sources]
lambdawalker-conda = { git = "ssh://git@github.com/lambdawalker/python.lambdawalker.conda.git" }
